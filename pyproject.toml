[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "in_out_parsimony"
version = "0.0.0"
authors = [
    { name="Mathieu Gascon" },
    { name="Mattéo Delabre", email="git.matteo@delab.re" },
]
description = "TODO"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "padapto",
    "sowing",
]

[project.scripts]
inoutpars = "in_out_parsimony.cli:main"

[project.urls]
"Homepage" = "https://github.com/UdeM-LBIT/InOutParsimony"
"Bug Tracker" = "https://github.com/UdeM-LBIT/InOutParsimony/issues"

[tool.hatch.build]
sources = ["src"]
only-include = ["src"]

[tool.hatch.envs.dev]
dependencies = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

[tool.hatch.envs.dev.scripts]
test = "pytest --exitfirst"
format = "black --diff --check --color ."
format-fix = "black ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
typecheck = "mypy src"

[tool.ruff.lint]
select = [
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    # eradicate
    "ERA",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-fixme
    "FIX",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["D100", "D105", "D203", "D212"]
